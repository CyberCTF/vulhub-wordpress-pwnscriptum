# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# WordPress 4.6 PwnScriptum (Vulhub, by phith0n and the Vulhub contributors) as an Isoloom spec:
# Vulhub's wordpress/pwnscriptum, vendored in app/: the published image
# vulhub/wordpress:4.6 and mysql:5, with the settings of Vulhub's compose file baked in.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: vulhub-wordpress-pwnscriptum

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.249.0/24, internet: false}

machines:
  mysql:
    networks: {lab: 20}
    resources: {cpus: 1, memory_mb: 512}
    ports:
      mysql:
        port: 3306
    app:
      build: build/mysql
  web:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 256}
    depends_on: [mysql]
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 80
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/web

checks:
  - name: the WordPress installer answers
    http: http://web/wp-admin/install.php
    wait: 240
  - name: WordPress 4.6 is connected to its database
    script: checks/wordpress.sh
    wait: 120

message: |
  WordPress 4.6 answers at {{ machines.web.ports.web.url }}. Finish the install with an admin user, as Vulhub's guide does.
  Who does WordPress say a password reset mail comes from, and where does that name come from?
